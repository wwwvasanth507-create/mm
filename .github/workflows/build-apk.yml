name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/WaveMusic.apk
          ls -lh build-output/WaveMusic.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveMusic-Android-APK
          path: build-output/WaveMusic.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-apk
          name: "WaveMusic Android APK (v1.0.0)"
          body: |
            ### 🎵 WaveMusic Android App (APK)
            - **24/7 Unlimited Non-Stop Audio Streaming**
            - **Brand New 3D Holographic App Icon**
            - **Audio-Reactive Ambient Lighting (Beat & Vocal Sync)**
            - **Dolby Atmos & Studio Hi-Fi Sound Engine**
            - **Zero Screen Sleep & Anti-Repeat Playback**
          files: build-output/WaveMusic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
