name: Build Android APK

on:
  push:
    branches: [ main, master, feature/native-android-audio-and-catalogue ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK for Artifact
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/Jalra-release.apk
          ls -lh build-output/Jalra-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jalra-Android-APK
          path: build-output/Jalra-release.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.0-apk
          name: "Jalra Android APK (v1.0.0)"
          body: |
            ### 🎵 Jalra Music Streaming App (APK)
            - **24/7 Unlimited Audio & Music Streaming**
            - **Offline-first with Bundled Cover Art & Local SQLite Cache**
            - **Dolby Atmos & Studio Hi-Fi Sound Engine**
            - **Auto Sync with Remote Music Catalogue**
          files: build-output/Jalra-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
