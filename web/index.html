<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Jalra - High quality Tamil music streaming experience. 24/7 unlimited songs, lossless audio, synced lyrics, and offline downloads.">
  <meta name="theme-color" content="#070B0E">

  <!-- OpenGraph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://music.jalra.workers.dev/">
  <meta property="og:title" content="Jalra 🎵 - High Quality Tamil Music Streaming">
  <meta property="og:description" content="Stream high-fidelity Tamil music non-stop 24 hours with studio sound quality on Jalra.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jalra 🎵 - High Quality Tamil Music Streaming">
  <meta name="twitter:description" content="Stream high-fidelity Tamil music non-stop 24 hours with studio sound quality on Jalra.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jalra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jalra 🎵 - High Quality Tamil Music Streaming</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #070B0E;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
    }

    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      user-select: none;
    }

    .logo-container {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 230, 118, 0.25), 0 0 20px rgba(255, 101, 132, 0.2);
      animation: pulseGlow 2.4s ease-in-out infinite alternate;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      object-fit: cover;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #FFFFFF 0%, #A5F3FC 50%, #6EE7B7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .brand-tagline {
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.5px;
      margin: 0;
    }

    .soundwave-loader {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 24px;
      margin-top: 6px;
    }

    .soundwave-bar {
      width: 3.5px;
      height: 8px;
      background: #00E676;
      border-radius: 2px;
      animation: soundwave 1.2s ease-in-out infinite alternate;
    }

    .soundwave-bar:nth-child(2) {
      animation-delay: 0.2s;
      height: 16px;
      background: #38BDF8;
    }

    .soundwave-bar:nth-child(3) {
      animation-delay: 0.4s;
      height: 22px;
      background: #FF6584;
    }

    .soundwave-bar:nth-child(4) {
      animation-delay: 0.6s;
      height: 14px;
      background: #A78BFA;
    }

    .soundwave-bar:nth-child(5) {
      animation-delay: 0.8s;
      height: 10px;
      background: #00E676;
    }

    @keyframes soundwave {
      0% {
        transform: scaleY(0.4);
      }
      100% {
        transform: scaleY(1.3);
      }
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.98);
        box-shadow: 0 8px 24px rgba(0, 230, 118, 0.2);
      }
      100% {
        transform: scale(1.02);
        box-shadow: 0 14px 40px rgba(0, 230, 118, 0.35), 0 0 30px rgba(255, 101, 132, 0.3);
      }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="logo-container">
      <img class="logo-img" src="icons/Icon-192.png" alt="Jalra Logo" />
    </div>
    <h1 class="brand-title">Jalra</h1>
    <p class="brand-tagline">Studio Hi-Fi Lossless Tamil Streaming</p>
    <div class="soundwave-loader">
      <div class="soundwave-bar"></div>
      <div class="soundwave-bar"></div>
      <div class="soundwave-bar"></div>
      <div class="soundwave-bar"></div>
      <div class="soundwave-bar"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
