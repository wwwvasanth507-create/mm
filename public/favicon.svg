<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FA2D48"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wave Crest Primary Gradient -->
    <linearGradient id="wave" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="35%" stop-color="#FA2D48"/>
      <stop offset="65%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#rim)" stroke-width="2" />

  <!-- Background Soundwave Bars (Subtle) -->
  <g opacity="0.35">
    <line x1="12" y1="28" x2="12" y2="36" stroke="#FF2A55" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="24" x2="16" y2="40" stroke="#FF2A55" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="22" x2="20" y2="42" stroke="#FA2D48" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="26" x2="24" y2="38" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="20" x2="28" y2="44" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="18" x2="32" y2="46" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="20" x2="36" y2="44" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="25" x2="40" y2="39" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="44" y1="22" x2="44" y2="42" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="24" x2="48" y2="40" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="52" y1="28" x2="52" y2="36" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Luminous Flowing "W" Wave -->
  <!-- Outer Glow Stroke -->
  <path d="M14 26 C16 38, 22 46, 26 46 C29 46, 31 38, 32 34 C33 38, 35 46, 38 46 C42 46, 48 38, 50 26" 
        stroke="url(#wave)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow)" />

  <!-- Core Sharp Wave Path -->
  <path d="M14 26 C16 38, 22 46, 26 46 C29 46, 31 38, 32 34 C33 38, 35 46, 38 46 C42 46, 48 38, 50 26" 
        stroke="url(#wave)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Crest Highlights -->
  <path d="M14 26 C15.5 32, 18 39, 21 42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
  <path d="M50 26 C48.5 32, 46 39, 43 42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

  <!-- Floating Micro Musical Particles -->
  <circle cx="21" cy="20" r="1.5" fill="#FA2D48" opacity="0.9"/>
  <circle cx="43" cy="18" r="1.5" fill="#06B6D4" opacity="0.9"/>
  <circle cx="32" cy="15" r="1.2" fill="#E879F9" opacity="0.8"/>
</svg>
